      description: 로그인된 사용자만 수행할 수 있습니다.
      operationId: createUser
      responses:
        default:
          description: 성공적인 처리
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
        description: 생성할 사용자 객체
        required: true
  '/user/{username}':
    get:
      tags:
        - user
      summary: 사용자 이름으로 사용자 조회
      description: ''
      operationId: getUserByName
      parameters:
        - name: username
          in: path
          description: '조회할 사용자 이름. 테스트용: user1'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 성공적인 처리
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            application/xml:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: 유효하지 않은 사용자 이름 제공
        '404':
          description: 사용자를 찾을 수 없음
    put:
      tags:
        - user
      summary: 사용자 수정
      description: 로그인된 사용자만 수행할 수 있습니다.
      operationId: updateUser
      parameters:
        - name: username
          in: path
          description: 삭제할 사용자 이름
          required: true
          schema:
            type: string
      responses:
        '400':
          description: 유효하지 않은 사용자 제공
        '404':
          description: 사용자를 찾을 수 없음
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
        description: 수정할 사용자 객체
        required: true
    delete:
      tags:
        - user
      summary: 사용자 삭제
      description: 로그인된 사용자만 수행할 수 있습니다.
      operationId: deleteUser
      parameters:
        - name: username
          in: path
          description: 삭제할 사용자 이름
          required: true
          schema:
            type: string
      responses:
        '400':
          description: 유효하지 않은 사용자 이름 제공
        '404':
          description: 사용자를 찾을 수 없음
  /user/createWithArray:
    post:
      tags:
        - user
      summary: 배열 입력으로 사용자 목록 생성
      description: ''
      operationId: createUsersWithArrayInput
      responses:
        default:
          description: 성공적인 처리
      requestBody:
        $ref: '#/components/requestBodies/UserArray'
  /user/createWithList:
    post:
      tags:
        - user
      summary: 리스트 입력으로 사용자 목록 생성
      description: ''
      operationId: createUsersWithListInput
      responses:
        default:
          description: 성공적인 처리
      requestBody:
        $ref: '#/components/requestBodies/UserArray'
  /user/login:
    get:
      tags:
        - user
      summary: 사용자 로그인
      description: ''
      operationId: loginUser
      parameters:
        - name: username
          in: query
          description: 로그인용 사용자 이름
          required: true
          schema:
            type: string
        - name: password
          in: query
          description: 일반 텍스트 비밀번호
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 성공적인 처리
          headers:
            X-Rate-Limit:
              description: 사용자당 시간당 호출 허용량
              schema:
                type: integer
                format: int32
            X-Expires-After:
              description: 토큰 만료(UTC)
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                type: string
              examples:
                response:
                  summary: |
                    **Docusaurus** `markdown`을 요약에 사용하는 예시입니다. 주의: admonition은 완전 지원되지 않습니다.
                  value: OK
            application/xml:
              schema:
                type: string
              examples:
                response:
                  value: <Message> OK </Message>
            text/plain:
              examples:
                response:
                  value: OK
        '400':
          description: 유효하지 않은 사용자 이름/비밀번호
  /user/logout:
    get:
      tags:
        - user
      summary: 현재 로그인된 사용자 세션 로그아웃
      description: ''
      operationId: logoutUser
      responses:
        default:
          description: 성공적인 처리
components:
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string
    Cat:
      x-tags:
        - pet
      description: 고양이에 대한 표현
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            huntingSkill:
              type: string
              description: 사냥 능력 측정 값
              default: lazy
              example: adventurous
              enum:
                - clueless
                - lazy
                - adventurous
                - aggressive
          required:
            - huntingSkill
    Category:
      type: object
      properties:
        id:
          description: 카테고리 ID
          allOf:
            - $ref: '#/components/schemas/Id'
        name:
          description: 카테고리명
          type: string
          minLength: 1
        sub:
          description: 하위 카테고리 테스트
          type: object
          properties:
            prop1:
              type: string
              description: 예시 속성
      xml:
        name: Category
    Dog:
      description: 개에 대한 표현
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            packSize:
              type: integer
              format: int32
              description: 무리의 크기
              default: 1
              minimum: 1
          required:
            - packSize
    HoneyBee:
      description: 꿀벌에 대한 표현
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            honeyPerDay:
              type: number
              description: 하루 평균 꿀 생산량(온스)
              example: 3.14
              multipleOf: .01
              default: 0
          required:
            - honeyPerDay
    Id:
      type: integer
      format: int64
      readOnly: true
    Order:
      type: object
      properties:
        id:
          description: 주문 ID
          allOf:
            - $ref: '#/components/schemas/Id'
        petId:
          description: 반려동물 ID
          allOf:
            - $ref: '#/components/schemas/Id'
        quantity:
          type: integer
          format: int32
          minimum: 1
          default: 1
        shipDate:
          description: 예상 배송일
          type: string
          format: date-time
        status:
          type: string
          description: 주문 상태
          enum:
            - placed
            - approved
            - delivered
        complete:
          description: 주문 완료 여부
          type: boolean
          default: false
          readOnly: true
        requestId:
          description: 고유 요청 ID
          type: string
          writeOnly: true
      xml:
        name: Order
    Pet:
      type: object
      description: 반려동물
      required:
        - name
        - photoUrls
        - tags
      discriminator:
        propertyName: petType
        mapping:
          cat: '#/components/schemas/Cat'
          dog: '#/components/schemas/Dog'
          bee: '#/components/schemas/HoneyBee'
      properties:
        id:
          externalDocs:
            description: '추가 정보를 확인하세요'
            url: 'https://example.com'
          description: 반려동물 ID
          allOf:
            - $ref: '#/components/schemas/Id'
        category:
          description: 반려동물이 속한 카테고리
          allOf:
            - $ref: '#/components/schemas/Category'
        name:
          description: 반려동물 이름
          type: string
          example: Guru
        photoUrls:
          description: 반려동물 사진 URL 목록
          type: array
          maxItems: 20
          xml:
            name: photoUrl
            wrapped: true
          items:
            type: string
            format: url
        friend:
          allOf:
            - $ref: '#/components/schemas/Pet'
        tags:
          description: 반려동물에 연결된 태그
          type: array
          minItems: 1
          xml:
            name: tag
            wrapped: true
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          description: 스토어 내 반려동물 상태
          enum:
            - available
            - pending
            - sold
          x-enumDescriptions:
            available: 반려동물이 이용 가능함
            pending: 반려동물이 판매 진행 중임
            sold: |
              반려동물이 판매 완료됨.

              이 설명은 줄바꿈을 포함할 수 있으며 [링크](https://docusaurus.io/)도 포함할 수 있습니다.
        petType:
          description: 반려동물 유형
          type: string
          oneOf:
            - $ref: '#/components/schemas/Cat'
            - $ref: '#/components/schemas/Dog'
            - $ref: '#/components/schemas/HoneyBee'
      xml:
        name: Pet
    Tag:
      type: object
      description: 반려동물 태그
      properties:
        id:
          description: 태그 ID
          allOf:
            - $ref: '#/components/schemas/Id'
        name:
          description: 태그명
          type: string
          minLength: 1
      xml:
        name: Tag
    User:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        pet:
          oneOf:
            - $ref: '#/components/schemas/Pet'
            - $ref: '#/components/schemas/Tag'
        username:
          description: 사용자가 제공한 사용자명
          type: string
          minLength: 4
          example: John78
        firstName:
          description: 이름
          type: string
          minLength: 1
          example: John
        lastName:
          description: 성
          type: string
          minLength: 1
          example: Smith
        email:
          description: 이메일 주소
          type: string
          format: email
          example: john.smith@example.com
        password:
          type: string
          description: >-
            사용자 비밀번호. 대문자·소문자·숫자를 혼합해야 합니다.
          format: password
          minLength: 8
          pattern: '/(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])/'
          example: drowssaP123
        phone:
          description: 국제 형식의 전화번호
          type: string
          pattern: '/^\+(?:[0-9]-?){6,14}[0-9]$/'
          example: +1-202-555-0192
        userStatus:
          description: 사용자 상태
          type: integer
          format: int32
      xml:
        name: User
  requestBodies:
    Pet:
      content:
        application/json:
          schema:
            allOf:
              - description: 내 반려동물
                title: 페티
              - $ref: '#/components/schemas/Pet'
          example:
            summary: 훌륭한 예시!
            category:
              name: Great Dane
              sub:
                prop1: Just a test property
            name: Pepper
            photoUrls:
              - https://assets.orvis.com/is/image/orvisprd/great-dane
            tags:
              - name: Great Danes
            status: pending
            petType:
              huntingSkill: lazy
        application/xml:
          schema:
            type: 'object'
            properties:
              name:
                type: string
                description: 만세
      description: 스토어에 추가할 반려동물 객체
      required: true
    UserArray:
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/User'
      description: 사용자 객체 목록
      required: true
  securitySchemes:
    petstore_auth:
      description: |
        계정 자격 증명을 보호하면서 데이터에 접근합니다.
        OAuth2는 보다 안전하고 보안적인 접근 방식을 제공합니다.
      type: oauth2
      flows:
        implicit:
          authorizationUrl: 'http://petstore.swagger.io/api/oauth/dialog'
          scopes:
            'write:pets': 내 계정의 반려동물 수정
            'read:pets': 내 반려동물 조회
    api_key:
      description: >
        이 샘플에서는 권한 필터를 테스트하기 위해 `special-key` API 키를 사용할 수 있습니다.
      type: apiKey
      name: api_key
      in: header
    BasicAuth:
      type: http
      scheme: basic
    BearerAuth:
      type: http
      scheme: bearer
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    OpenID:
      type: openIdConnect
      openIdConnectUrl: https://example.com/.well-known/openid-configuration
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://example.com/oauth/authorize
          tokenUrl: https://example.com/oauth/token
          scopes:
            read: 읽기 접근 권한
            write: 쓰기 접근 권한
            admin: 관리자 작업 접근 권한
x-webhooks:
  newPet:
    post:
      summary: 새 반려동물
      description: 시스템에 등록된 새 반려동물 정보
      operationId: newPet
      tags:
        - pet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: 데이터를 성공적으로 수신했음을 나타내는 200 상태를 반환합니다
